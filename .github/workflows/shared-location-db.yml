name: Shared Location PostgreSQL integration
on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'tests/db/shared-locations.test.ts'
      - '.github/workflows/shared-location-db.yml'

jobs:
  verify-shared-locations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: PostgreSQL shared-location migration and workflow regression
        run: node --import tsx --test tests/db/shared-locations.test.ts
