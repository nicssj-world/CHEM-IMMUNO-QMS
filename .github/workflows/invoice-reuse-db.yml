name: Invoice reuse PostgreSQL integration
on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'tests/db/invoice-reuse.test.ts'
      - '.github/workflows/invoice-reuse-db.yml'
      - 'src/app/actions/inventory.ts'

jobs:
  verify-invoice-reuse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Reuse cancelled invoice numbers and reject active duplicates
        run: node --import tsx --test tests/db/invoice-reuse.test.ts
